services:

  node-exporter:
    image: prom/node-exporter
    deploy:
      resources:
        limits:
          cpus: "0.25"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.0.1
    depends_on:
      - node-exporter
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring